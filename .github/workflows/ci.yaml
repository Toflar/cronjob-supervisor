name: CI

on:
    pull_request: ~
    schedule:
        - cron: 0 13 * * MON

permissions: read-all

jobs:
    quality:
        uses: terminal42/code-quality-tools/.github/workflows/code-quality.yml@main

    tests-linux:
        name: 'Linux: PHP ${{ matrix.php }} (${{ matrix.dependencies }})'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.1', '8.2', '8.3', '8.4', '8.5']
                dependencies: ['highest']
                include:
                    - php: '8.1'
                      dependencies: lowest
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v3

            - name: Install the dependencies
              run: composer update --no-interaction --no-plugins --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

            - name: Run the unix tests
              run: composer unix-tests

    tests-windows:
        name: 'Windows: PHP ${{ matrix.php }} (${{ matrix.dependencies }})'
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.1', '8.2', '8.3', '8.4', '8.5']
                dependencies: ['highest']
                include:
                    - php: '8.1'
                      dependencies: lowest
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v3

            - name: Install the dependencies
              run: composer update --no-interaction --no-plugins --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

            - name: Run the windows tests
              run: composer windows-tests
